apiVersion: 1

datasources:
  - name: 'OpenObserve'
    type: 'grafana-openobserve-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    url: 'http://localhost:8000'
    user: 'user'
    jsonData:
      database: 'default' # organization
    secureJsonData:
      password: 'password'
