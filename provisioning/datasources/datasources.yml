apiVersion: 1

datasources:
  - name: 'OpenObserve'
    type: 'linpr-openobserve-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    url: 'http://localhost:8000'
    user: 'user'
    jsonData:
      # OpenObserve organization (the legacy "database" key still works)
      organization: 'default'
      authMethod: 'basic'
      timeoutSeconds: 60
      defaultLimit: 500
      maxLimit: 10000
      # Optional column overrides
      timeField: ''
      logMessageField: ''
      logLevelField: ''
      enablePrometheus: true
    secureJsonData:
      password: 'password'
