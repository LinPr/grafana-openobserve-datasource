# Builds the plugin archive and attaches it to a GitHub release.
#
# This deliberately does not use grafana/plugin-actions/build-plugin: that
# action runs @grafana/plugin-validator, whose osv-scanner fails the build on
# CVEs in transitive dev dependencies locked by @grafana/* itself
# (browserslist, fast-uri, js-yaml, postcss, ws, ...), plus a "Go SDK older
# than 5 months" check that would break the release every few months. The
# plugin ships from GitHub releases, not the Grafana catalogue, so those gates
# do not apply here.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Build with the newest patch even though go.mod declares 1.27.3.
      #
      # `go` in go.mod is the compatibility floor, and the catalogue's source
      # scan can only run toolchains up to 1.27.3; a higher floor is a hard
      # block. The binary still needs 1.27.4, which fixes GO-2026-6859 in
      # net/http, so the build uses 1.27.4 while the floor stays at 1.27.3.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # mage's BuildAll compiles linux (amd64/arm64/arm), windows/amd64 and
      # darwin (amd64/arm64). Cross-compilation is pure Go here: the backend has
      # no cgo, so every target builds on the amd64 runner.
      - name: Build backend for every supported platform
        run: mage -v

      - name: Verify every platform is present
        run: |
          set -euo pipefail
          EXE=$(jq -r .executable dist/plugin.json)
          # The plugin catalogue requires exactly 0755 on the binaries. mage
          # inherits the runner's umask, so set it explicitly rather than
          # depend on what that happens to be.
          chmod 0755 dist/"${EXE}"_*
          missing=0
          for target in linux_amd64 linux_arm64 linux_arm windows_amd64 darwin_amd64 darwin_arm64; do
            os=${target%%_*}
            file="dist/${EXE}_${target}"
            [ "$os" = "windows" ] && file="${file}.exe"
            if [ -f "$file" ]; then
              printf '%-18s %s\n' "$target" "$(du -h "$file" | cut -f1)"
            else
              printf '%-18s MISSING (%s)\n' "$target" "$file" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "some platforms did not build" >&2; exit 1; }

      - name: Package archives
        run: |
          set -euo pipefail
          PLUGIN_ID=$(jq -r .id dist/plugin.json)
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          EXE=$(jq -r .executable dist/plugin.json)

          # The tag must match the version in plugin.json, otherwise the
          # release would carry a misleading name.
          if [ "v${PLUGIN_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "plugin.json says v${PLUGIN_VERSION} but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          # Archive *filenames* drop the org prefix, so downloads read
          # grafana-openobserve-datasource-*. Only the file name changes: the
          # directory inside must stay equal to the plugin id, which is what
          # Grafana and the catalogue validator read.
          ARCHIVE_BASE="grafana-openobserve-datasource"

          # 1. The universal archive Grafana expects: one folder holding every
          #    platform binary, so `grafana-cli plugins install` works from a URL.
          mv "dist" "${PLUGIN_ID}"
          ARCHIVE="${ARCHIVE_BASE}-${PLUGIN_VERSION}.zip"
          zip -qr "$ARCHIVE" "$PLUGIN_ID"

          # 2. One archive per platform, for anyone who only wants their own
          #    architecture: ~40 MB each instead of ~230 MB for the whole set.
          declare -A SUFFIX=(
            [linux_amd64]=linux-amd64
            [linux_arm64]=linux-arm64
            [linux_arm]=linux-arm
            [windows_amd64]=windows-amd64
            [darwin_amd64]=darwin-amd64
            [darwin_arm64]=darwin-arm64
          )
          for target in "${!SUFFIX[@]}"; do
            os=${target%%_*}
            bin="${EXE}_${target}"
            [ "$os" = "windows" ] && bin="${bin}.exe"

            stage=$(mktemp -d)
            cp -r "${PLUGIN_ID}" "${stage}/${PLUGIN_ID}"
            # Keep only this platform's binary, so the zip is single-arch.
            find "${stage}/${PLUGIN_ID}" -maxdepth 1 -name "${EXE}_*" ! -name "$bin" -delete
            # NoArch/NoOs entries would tell Grafana the plugin is universal,
            # which is false once only one binary is shipped.
            jq 'del(.info.build)' "${stage}/${PLUGIN_ID}/plugin.json" > "${stage}/p.json" \
              && mv "${stage}/p.json" "${stage}/${PLUGIN_ID}/plugin.json"

            per_arch="${ARCHIVE_BASE}-${PLUGIN_VERSION}.${SUFFIX[$target]}.zip"
            ( cd "$stage" && zip -qr "$OLDPWD/$per_arch" "$PLUGIN_ID" )
            rm -rf "$stage"
            printf '%-46s %s\n' "$per_arch" "$(du -h "$per_arch" | cut -f1)"
          done

          # One checksum per archive, in its own file.
          #
          # The submission form takes a single hash for the archive being
          # uploaded, and a combined checksums.txt makes it easy to copy the
          # wrong line -- the first line was the darwin build while the
          # universal archive is what gets submitted. A sidecar with nothing
          # but the hash removes the ambiguity.
          for archive in ./*.zip; do
            sha1sum "$archive" | cut -d' ' -f1 > "${archive}.sha1"
            md5sum  "$archive" | cut -d' ' -f1 > "${archive}.md5"
          done

          # The combined list stays for scripted verification, universal
          # archive first so it is the obvious first line.
          # The archive name drops the org prefix; the directory inside keeps
          # the plugin id.
          UNIVERSAL="${ARCHIVE_BASE}-${PLUGIN_VERSION}.zip"
          # Print "<hash>  <name>" without the "./" that the glob adds. A fixed
          # character offset would eat into a bare filename.
          sha1line() { sha1sum "$1" | awk '{ n=$2; sub(/^\.\//, "", n); print $1"  "n }'; }
          {
            sha1line "./$UNIVERSAL"
            for archive in ./*.zip; do
              [ "$archive" = "./$UNIVERSAL" ] && continue
              sha1line "$archive"
            done
          } > checksums.txt
          cat checksums.txt
          echo
          echo "Upload ${UNIVERSAL} and use this checksum:"
          cat "${UNIVERSAL}.sha1"

          # The catalogue form takes one hash for one archive. Show the pair
          # where the submitter will actually look for it.
          {
            echo "### Submit this archive"
            echo
            echo '```'
            echo "${UNIVERSAL}"
            echo '```'
            echo
            echo "### Checksum (SHA-1)"
            echo
            echo '```'
            cat "${UNIVERSAL}.sha1"
            echo '```'
            echo
            echo "Every archive also has a \`.sha1\` and \`.md5\` sidecar, and"
            echo '`checksums.txt` lists the universal archive on the first line.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.zip.sha1
            *.zip.md5
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
